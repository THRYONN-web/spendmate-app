<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SpendMate Mini App</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #f8fafc);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      background-color: var(--tg-theme-secondary-bg-color, #1e293b);
    }
  </style>
</head>
<body class="p-4 pb-24 select-none">
  <!-- Шапка -->
  <header class="flex justify-between items-center mb-6">
    <div>
      <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Ваш бюджет</span>
      <h1 class="text-2xl font-bold" id="user-greeting">SpendMate</h1>
    </div>
    <div class="card px-3 py-1.5 rounded-full border border-slate-700/50 flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-xs font-medium text-slate-300">Синхронизировано</span>
    </div>
  </header>

  <!-- Карточка баланса -->
  <section class="card p-5 rounded-2xl border border-slate-700/40 mb-6 shadow-lg shadow-indigo-950/20">
    <div class="text-slate-400 text-sm mb-1">Всего регулярных трат:</div>
    <div class="text-3xl font-extrabold text-indigo-400 tracking-tight" id="total-amount">0 ₽ <span class="text-sm font-normal text-slate-400">/ мес</span></div>
    
    <div class="mt-4 pt-3 border-t border-slate-700/50 flex justify-between text-xs text-slate-400">
      <span>Уведомления: <b>за 24 часа</b></span>
      <span id="sub-count">Подписок: 0</span>
    </div>
  </section>

  <!-- Быстрые шаблоны -->
  <section class="mb-6">
    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Популярные сервисы</div>
    <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
      <button onclick="setPreset('Telegram Premium', 299)" class="card px-3 py-2 rounded-xl text-xs font-medium border border-slate-700/60 whitespace-nowrap active:scale-95 transition-transform">
        ⭐ TG Premium (299 ₽)
      </button>
      <button onclick="setPreset('Яндекс Плюс', 299)" class="card px-3 py-2 rounded-xl text-xs font-medium border border-slate-700/60 whitespace-nowrap active:scale-95 transition-transform">
        🔴 Яндекс Плюс (299 ₽)
      </button>
      <button onclick="setPreset('VPN', 150)" class="card px-3 py-2 rounded-xl text-xs font-medium border border-slate-700/60 whitespace-nowrap active:scale-95 transition-transform">
        🛡 VPN (150 ₽)
      </button>
      <button onclick="setPreset('VK Музыка', 169)" class="card px-3 py-2 rounded-xl text-xs font-medium border border-slate-700/60 whitespace-nowrap active:scale-95 transition-transform">
        🎵 VK Музыка (169 ₽)
      </button>
    </div>
  </section>

  <!-- Форма добавления -->
  <section class="card p-5 rounded-2xl border border-slate-700/50 mb-6">
    <h2 class="text-base font-bold mb-4 flex items-center gap-2">
      <span>➕</span> Добавить подписку
    </h2>

    <div class="space-y-3">
      <div>
        <label class="block text-xs text-slate-400 mb-1">Название сервиса</label>
        <input id="sub-title" type="text" placeholder="например: YouTube Premium" class="w-full px-3 py-2.5 rounded-xl bg-slate-900/60 border border-slate-700 text-sm focus:outline-none focus:border-indigo-500 transition-colors">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Стоимость (₽)</label>
          <input id="sub-price" type="number" placeholder="299" class="w-full px-3 py-2.5 rounded-xl bg-slate-900/60 border border-slate-700 text-sm focus:outline-none focus:border-indigo-500 transition-colors">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">День списания</label>
          <input id="sub-day" type="number" min="1" max="31" placeholder="число от 1 до 31" class="w-full px-3 py-2.5 rounded-xl bg-slate-900/60 border border-slate-700 text-sm focus:outline-none focus:border-indigo-500 transition-colors">
        </div>
      </div>

      <button onclick="saveAndSend()" class="w-full mt-2 py-3 bg-indigo-600 hover:bg-indigo-500 active:scale-98 text-white font-semibold rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/30 flex justify-center items-center gap-2">
        <span>Сохранить в бота</span>
      </button>
    </div>
  </section>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user?.first_name) {
        document.getElementById('user-greeting').innerText = `Привет, ${tg.initDataUnsafe.user.first_name}!`;
      }
    }

    function setPreset(title, price) {
      document.getElementById('sub-title').value = title;
      document.getElementById('sub-price').value = price;
      document.getElementById('sub-day').value = new Date().getDate();
    }

    function saveAndSend() {
      const title = document.getElementById('sub-title').value.trim();
      const price = parseFloat(document.getElementById('sub-price').value);
      const day = parseInt(document.getElementById('sub-day').value);

      if (!title) {
        tg?.showAlert ? tg.showAlert('Введите название сервиса') : alert('Введите название сервиса');
        return;
      }
      if (isNaN(price) || price <= 0) {
        tg?.showAlert ? tg.showAlert('Введите корректную сумму') : alert('Введите корректную сумму');
        return;
      }
      if (isNaN(day) || day < 1 || day > 31) {
        tg?.showAlert ? tg.showAlert('День должен быть от 1 до 31') : alert('День должен быть от 1 до 31');
        return;
      }

      const payload = {
        action: 'add_sub',
        title: title,
        price: price,
        pay_day: day
      };

      if (tg && tg.sendData) {
        // Отправка данных боту и автоматическое закрытие WebApp
        tg.sendData(JSON.stringify(payload));
      } else {
        alert('Данные готовы: ' + JSON.stringify(payload) + '\n(Откройте через кнопку Telegram, чтобы синхронизировать с ботом)');
      }
    }
  </script>
</body>
</html>
