<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SpendMate Dashboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #121417;
      --bg-surface: #1A1D21;
      --bg-elevated: #22262B;
      --border-subtle: #2A2F37;
      --border-focus: #10B981;
      --accent-primary: #10B981;
      --accent-bright: #34D399;
      --text-primary: #F3F4F6;
      --text-secondary: #9CA3AF;
      --text-muted: #6B7280;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    .surface-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
    }

    .hero-card {
      background: radial-gradient(120% 120% at 100% 0%, rgba(16, 185, 129, 0.14) 0%, rgba(26, 29, 33, 0.98) 65%), var(--bg-surface);
      border: 1px solid rgba(16, 185, 129, 0.28);
    }

    .input-field {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .preset-pill {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      transition: transform 150ms ease-out, border-color 150ms ease-out, background-color 150ms ease-out;
    }

    .preset-pill:active {
      transform: scale(0.96);
      border-color: var(--accent-primary);
      background-color: rgba(16, 185, 129, 0.1);
    }

    .btn-emerald {
      background: linear-gradient(180deg, #10B981 0%, #059669 100%);
      color: #042f2e;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.22);
      transition: transform 150ms ease-out, filter 150ms ease-out;
    }

    .btn-emerald:active {
      transform: scale(0.98);
      filter: brightness(1.06);
    }

    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="p-4 pb-20 select-none min-h-screen">

  <!-- Шапка профиля -->
  <header class="flex justify-between items-center mb-5">
    <div>
      <div class="flex items-center gap-1.5 mb-0.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-[10px] text-zinc-400 font-bold tracking-widest uppercase">Финансовый терминал</span>
      </div>
      <h1 class="text-xl font-extrabold tracking-tight flex items-center gap-2" id="user-greeting">
        <span>SpendMate</span>
        <span id="pro-badge" class="hidden text-[10px] font-mono-num bg-emerald-500/15 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded-md font-bold tracking-wider">PRO</span>
      </h1>
    </div>

    <div class="flex items-center gap-2">
      <!-- Индикатор автосохранения -->
      <div id="sync-status" class="text-[10px] font-medium text-emerald-400 bg-emerald-500/10 border border-emerald-500/25 px-2.5 py-1 rounded-lg flex items-center gap-1.5 transition-all">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <span id="sync-status-text">Синхронизировано</span>
      </div>

      <div id="sub-counter-badge" class="surface-card px-3 py-1.5 rounded-xl text-xs font-mono-num text-zinc-300 font-medium">
        0/3
      </div>
    </div>
  </header>

  <main>
    <!-- Главная карточка регулярного бюджета -->
    <section class="hero-card p-5 rounded-2xl mb-6 shadow-2xl shadow-black/50" aria-label="Сводка бюджета">
      <div class="flex justify-between items-start">
        <div>
          <span class="text-xs text-zinc-400 font-semibold">Ежемесячная нагрузка</span>
          <div class="text-3xl font-extrabold font-mono-num text-emerald-400 mt-1 tracking-tight" id="total-sum">
            0 ₽
          </div>
        </div>
        <div class="text-right">
          <span class="text-[11px] text-zinc-400 block">За год (~12 мес)</span>
          <span class="text-xs font-mono-num font-bold text-zinc-300" id="yearly-sum">0 ₽</span>
        </div>
      </div>

      <!-- Прогресс-бар заполнения тарифа -->
      <div class="mt-4">
        <div class="w-full h-1.5 bg-zinc-800 rounded-full overflow-hidden">
          <div id="quota-bar" class="h-full bg-emerald-500 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <div class="mt-3 pt-3 border-t border-zinc-800/80 flex justify-between items-center text-xs text-zinc-400">
        <span class="flex items-center gap-1.5">
          <span class="text-emerald-400">🔔</span> Пуш за 24 часа
        </span>
        <span id="next-pay-hint" class="font-medium text-zinc-300">Ближайшая оплата: —</span>
      </div>
    </section>

    <!-- Список активных подписок -->
    <section class="mb-6" aria-label="Активные подписки">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Активные подписки</h2>
        <span id="limit-warning" class="hidden text-[11px] font-semibold text-amber-400 bg-amber-500/10 border border-amber-500/30 px-2 py-0.5 rounded-md">
          Лимит Free (3/3)
        </span>
      </div>

      <div id="subs-list" class="space-y-2.5"></div>

      <!-- Пустое состояние -->
      <div id="empty-state" class="hidden py-9 px-4 text-center surface-card rounded-2xl border-dashed">
        <div class="w-11 h-11 mx-auto mb-2.5 rounded-xl bg-zinc-800/80 border border-zinc-700/60 flex items-center justify-center text-xl">
          📊
        </div>
        <div class="text-sm font-bold text-zinc-200">Список регулярных трат пуст</div>
        <div class="text-xs text-zinc-500 mt-1">Выберите шаблон ниже или добавьте свой сервис</div>
      </div>
    </section>

    <!-- Быстрые пресеты -->
    <section class="mb-6" aria-label="Быстрые шаблоны">
      <div class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2.5">Быстрые шаблоны</div>
      <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
        <button type="button" onclick="setPreset('Telegram Premium', 299)" class="preset-pill px-3.5 py-2 rounded-xl text-xs font-semibold text-zinc-200 whitespace-nowrap flex items-center gap-1.5">
          <span>⭐</span> TG Premium <span class="font-mono-num text-emerald-400">299₽</span>
        </button>
        <button type="button" onclick="setPreset('Яндекс Плюс', 299)" class="preset-pill px-3.5 py-2 rounded-xl text-xs font-semibold text-zinc-200 whitespace-nowrap flex items-center gap-1.5">
          <span>🟢</span> Яндекс Плюс <span class="font-mono-num text-emerald-400">299₽</span>
        </button>
        <button type="button" onclick="setPreset('VPN Сервер', 150)" class="preset-pill px-3.5 py-2 rounded-xl text-xs font-semibold text-zinc-200 whitespace-nowrap flex items-center gap-1.5">
          <span>🛡</span> VPN <span class="font-mono-num text-emerald-400">150₽</span>
        </button>
        <button type="button" onclick="setPreset('VK Музыка', 169)" class="preset-pill px-3.5 py-2 rounded-xl text-xs font-semibold text-zinc-200 whitespace-nowrap flex items-center gap-1.5">
          <span>🎧</span> VK Музыка <span class="font-mono-num text-emerald-400">169₽</span>
        </button>
      </div>
    </section>

    <!-- Форма добавления подписки -->
    <section class="surface-card p-5 rounded-2xl mb-6" aria-label="Форма добавления">
      <h3 class="text-sm font-bold text-zinc-100 mb-3.5 flex items-center gap-2">
        <span class="w-5 h-5 rounded-md bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-bold">+</span>
        Новая подписка
      </h3>

      <div class="space-y-3">
        <div>
          <label for="sub-title" class="block text-[11px] font-semibold text-zinc-400 mb-1">Название сервиса</label>
          <input id="sub-title" type="text" placeholder="Например: YouTube Premium, Bhost" class="input-field w-full px-3.5 py-2.5 rounded-xl text-sm placeholder-zinc-600">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="sub-price" class="block text-[11px] font-semibold text-zinc-400 mb-1">Сумма в месяц (₽)</label>
            <input id="sub-price" type="number" inputmode="decimal" placeholder="299" class="input-field font-mono-num w-full px-3.5 py-2.5 rounded-xl text-sm placeholder-zinc-600">
          </div>
          <div>
            <label for="sub-day" class="block text-[11px] font-semibold text-zinc-400 mb-1">День оплаты (1–31)</label>
            <input id="sub-day" type="number" inputmode="numeric" min="1" max="31" placeholder="15" class="input-field font-mono-num w-full px-3.5 py-2.5 rounded-xl text-sm placeholder-zinc-600">
          </div>
        </div>

        <button type="button" onclick="addSubLocally()" class="btn-emerald w-full mt-2 py-3 rounded-xl font-extrabold text-sm flex items-center justify-center gap-1.5">
          <span>＋ Добавить в список</span>
        </button>
      </div>
    </section>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    const SYNC_API_URL = "https://spendmate-sync.8altopunov.workers.dev/api/sync";
    let appState = { is_pro: false, subs: [], user_id: 0, updated_at: 0 };
    let autoSaveTimer = null;
    let isSyncing = false;

    if (tg) {
      tg.ready();
      tg.expand();

      try {
        tg.setHeaderColor('#121417');
        tg.setBackgroundColor('#121417');
      } catch (e) {}

      if (tg.initDataUnsafe?.user?.first_name) {
        document.getElementById('user-greeting').innerHTML = `
          <span>${tg.initDataUnsafe.user.first_name}</span>
          <span id="pro-badge" class="hidden text-[10px] font-mono-num bg-emerald-500/15 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded-md font-bold tracking-wider">PRO</span>
        `;
      }
    }

    function getUserId() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawU = urlParams.get('u');
      const paramU = rawU ? parseInt(rawU, 10) : 0;
      const tgUser = tg?.initDataUnsafe?.user?.id ? parseInt(tg.initDataUnsafe.user.id, 10) : 0;
      const stateUser = appState?.user_id ? parseInt(appState.user_id, 10) : 0;

      const resolved = stateUser || paramU || tgUser || 0;
      if (resolved && (!appState.user_id || appState.user_id !== resolved)) {
        appState.user_id = resolved;
      }
      return resolved;
    }

    function setSyncStatus(state, text) {
      const statusEl = document.getElementById('sync-status');
      const statusText = document.getElementById('sync-status-text');
      if (!statusEl || !statusText) return;

      if (state === 'syncing') {
        statusEl.className = "text-[10px] font-medium text-amber-300 bg-amber-500/15 border border-amber-500/30 px-2.5 py-1 rounded-lg flex items-center gap-1.5 transition-all";
        statusText.innerText = text || "Сохранение...";
      } else if (state === 'synced') {
        statusEl.className = "text-[10px] font-medium text-emerald-400 bg-emerald-500/10 border border-emerald-500/25 px-2.5 py-1 rounded-lg flex items-center gap-1.5 transition-all";
        statusText.innerText = text || "Синхронизировано";
      } else if (state === 'error') {
        statusEl.className = "text-[10px] font-medium text-rose-400 bg-rose-500/15 border border-rose-500/30 px-2.5 py-1 rounded-lg flex items-center gap-1.5 transition-all";
        statusText.innerText = text || "Ошибка сети";
      } else if (state === 'offline') {
        statusEl.className = "text-[10px] font-medium text-zinc-300 bg-zinc-800 border border-zinc-700 px-2.5 py-1 rounded-lg flex items-center gap-1.5 transition-all";
        statusText.innerText = text || "Оффлайн (в очереди)";
      }
    }

    async function executeSync() {
      if (isSyncing) return;
      const userId = getUserId();
      if (!userId) {
        console.warn("User ID не определен!");
        setSyncStatus('error', 'Перезапустите бота');
        return;
      }

      isSyncing = true;
      setSyncStatus('syncing', 'Сохранение...');

      const payload = {
        user_id: userId,
        initData: tg?.initData || "",
        subs: appState.subs || []
      };

      try {
        const resp = await fetch(SYNC_API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload),
          keepalive: true
        });

        if (resp.ok) {
          localStorage.removeItem('spendmate_pending_sync');
          setSyncStatus('synced', 'Синхронизировано');
        } else {
          throw new Error(`HTTP ${resp.status}`);
        }
      } catch (err) {
        console.error("Ошибка синхронизации:", err);
        localStorage.setItem('spendmate_pending_sync', 'true');
        setSyncStatus('error', 'Ошибка сети (повтор)');
      } finally {
        isSyncing = false;
      }
    }

    function triggerAutoSave(immediate = false) {
      appState.updated_at = Date.now();
      localStorage.setItem('spendmate_cache', JSON.stringify(appState));
      localStorage.setItem('spendmate_pending_sync', 'true');

      if (autoSaveTimer) {
        clearTimeout(autoSaveTimer);
        autoSaveTimer = null;
      }

      if (immediate) {
        executeSync();
      } else {
        setSyncStatus('syncing', 'Сохранение...');
        autoSaveTimer = setTimeout(() => {
          executeSync();
        }, 300);
      }
    }

    // Принудительный сброс очереди при выходе или сворачивании окна
    function flushSync() {
      if (localStorage.getItem('spendmate_pending_sync') === 'true') {
        if (autoSaveTimer) {
          clearTimeout(autoSaveTimer);
          autoSaveTimer = null;
        }
        executeSync();
      }
    }

    window.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flushSync();
    });
    window.addEventListener('pagehide', flushSync);
    window.addEventListener('beforeunload', flushSync);
    window.addEventListener('online', () => {
      if (localStorage.getItem('spendmate_pending_sync') === 'true') {
        executeSync();
      }
    });

    function parsePayload() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        let encoded = urlParams.get('d');
        const urlVersion = parseInt(urlParams.get('v') || "0", 10) * 1000;
        const cachedStr = localStorage.getItem('spendmate_cache');
        const hasPendingSync = localStorage.getItem('spendmate_pending_sync') === 'true';

        let cached = null;
        if (cachedStr) {
          try { cached = JSON.parse(cachedStr); } catch (e) {}
        }

        if (encoded) {
          encoded = encoded.replace(/-/g, '+').replace(/_/g, '/');
          while (encoded.length % 4 !== 0) encoded += '=';
          const binary = atob(encoded);
          const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
          const decodedJson = new TextDecoder().decode(bytes);
          const parsed = JSON.parse(decodedJson);

          // Если в локальном кэше есть неотправленные правки и они свежее ссылки бота, сохраняем локальные!
          if (cached && hasPendingSync && (cached.updated_at || 0) > urlVersion) {
            appState = cached;
            triggerAutoSave(true);
          } else if (parsed && Array.isArray(parsed.subs)) {
            appState = parsed;
            appState.updated_at = urlVersion || Date.now();
            localStorage.setItem('spendmate_cache', JSON.stringify(appState));
          }
        } else if (cached && Array.isArray(cached.subs)) {
          appState = cached;
        }
      } catch (err) {
        console.error("Ошибка чтения данных:", err);
      }

      if (!appState || !Array.isArray(appState.subs)) {
        appState = { is_pro: false, subs: [], user_id: 0, updated_at: Date.now() };
      }

      getUserId();
      renderDashboard();

      if (localStorage.getItem('spendmate_pending_sync') === 'true') {
        triggerAutoSave(true);
      }
    }

    function getDaysUntil(payDay) {
      if (!payDay) return 0;
      const today = new Date();
      const currentDay = today.getDate();
      let diff = parseInt(payDay) - currentDay;
      if (diff < 0) {
        const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
        diff += daysInMonth;
      }
      return diff;
    }

    function getServiceIcon(title) {
      const t = String(title || '').toLowerCase();
      if (t.includes('tg') || t.includes('telegr') || t.includes('тг')) return '⭐';
      if (t.includes('янд') || t.includes('plus') || t.includes('плюс')) return '🟢';
      if (t.includes('vpn') || t.includes('впн')) return '🛡';
      if (t.includes('vk') || t.includes('вк') || t.includes('музык') || t.includes('spot')) return '🎧';
      if (t.includes('кино') || t.includes('иви') || t.includes('okko') || t.includes('netfl')) return '🎬';
      if (t.includes('bhost') || t.includes('хост') || t.includes('сервер')) return '🖥';
      return '💳';
    }

    function renderDashboard() {
      const subsList = document.getElementById('subs-list');
      const emptyState = document.getElementById('empty-state');
      const totalSumEl = document.getElementById('total-sum');
      const yearlySumEl = document.getElementById('yearly-sum');
      const counterEl = document.getElementById('sub-counter-badge');
      const proBadge = document.getElementById('pro-badge');
      const nextPayHint = document.getElementById('next-pay-hint');
      const limitWarning = document.getElementById('limit-warning');
      const quotaBar = document.getElementById('quota-bar');

      const count = appState.subs.length;

      if (appState.is_pro) {
        proBadge?.classList.remove('hidden');
        counterEl.innerText = `PRO · ${count}`;
        limitWarning?.classList.add('hidden');
        quotaBar.style.width = '100%';
      } else {
        proBadge?.classList.add('hidden');
        counterEl.innerText = `Лимит: ${count}/3`;
        const pct = Math.min(100, Math.round((count / 3) * 100));
        quotaBar.style.width = `${pct}%`;

        if (count >= 3) {
          limitWarning?.classList.remove('hidden');
        } else {
          limitWarning?.classList.add('hidden');
        }
      }

      let total = 0;
      let minDays = 999;
      let nextSubTitle = '';

      subsList.innerHTML = '';
      if (count === 0) {
        emptyState.classList.remove('hidden');
        nextPayHint.innerText = 'Ближайшая оплата: —';
      } else {
        emptyState.classList.add('hidden');
        appState.subs.forEach(sub => {
          const price = parseFloat(sub.price) || 0;
          total += price;
          const daysLeft = getDaysUntil(sub.pay_day);

          if (daysLeft < minDays) {
            minDays = daysLeft;
            nextSubTitle = sub.title;
          }

          let daysText = daysLeft === 0 ? 'Сегодня' : daysLeft === 1 ? 'Завтра' : `через ${daysLeft} дн.`;
          let badgeClass = daysLeft <= 2
            ? 'text-amber-300 bg-amber-500/15 border-amber-500/30'
            : 'text-emerald-300 bg-emerald-500/10 border-emerald-500/20';

          const card = document.createElement('article');
          card.className = "surface-card p-3.5 rounded-xl flex items-center justify-between transition-all hover:border-zinc-700";
          card.innerHTML = `
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-10 h-10 shrink-0 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-lg">
                ${getServiceIcon(sub.title)}
              </div>
              <div class="min-w-0">
                <div class="font-bold text-sm text-zinc-100 truncate">${sub.title}</div>
                <div class="flex items-center gap-2 mt-0.5">
                  <span class="text-[11px] text-zinc-400 font-mono-num">${sub.pay_day}-е число</span>
                  <span class="text-[10px] font-mono-num px-1.5 py-0.5 rounded border ${badgeClass}">${daysText}</span>
                </div>
              </div>
            </div>
            <div class="flex items-center gap-2.5 shrink-0 ml-2">
              <div class="font-mono-num font-bold text-sm text-emerald-400">${price} ₽</div>
              <button type="button" aria-label="Удалить подписку" onclick="removeSubLocally(${sub.id})" class="w-8 h-8 rounded-lg bg-zinc-900/80 border border-zinc-800 text-zinc-400 hover:text-rose-400 hover:border-rose-500/40 active:scale-90 transition-all flex items-center justify-center text-xs">
                ✕
              </button>
            </div>
          `;
          subsList.appendChild(card);
        });

        nextPayHint.innerText = minDays === 0 ? `Сегодня: ${nextSubTitle}` : `Через ${minDays} дн. · ${nextSubTitle}`;
      }

      totalSumEl.innerText = `${total.toLocaleString('ru-RU')} ₽`;
      yearlySumEl.innerText = `${(total * 12).toLocaleString('ru-RU')} ₽`;
    }

    function setPreset(title, price) {
      document.getElementById('sub-title').value = title;
      document.getElementById('sub-price').value = price;
      document.getElementById('sub-day').value = new Date().getDate();
      tg?.HapticFeedback?.impactOccurred('light');
    }

    function addSubLocally() {
      const titleInput = document.getElementById('sub-title');
      const priceInput = document.getElementById('sub-price');
      const dayInput = document.getElementById('sub-day');

      const title = titleInput.value.trim();
      const price = parseFloat(priceInput.value);
      const day = parseInt(dayInput.value);

      if (!title || isNaN(price) || price <= 0 || isNaN(day) || day < 1 || day > 31) {
        tg?.HapticFeedback?.notificationOccurred('error');
        tg?.showAlert ? tg.showAlert('Заполните корректно название, сумму и день списания (от 1 до 31)') : alert('Заполните все поля');
        return;
      }

      if (!appState.is_pro && appState.subs.length >= 3) {
        tg?.HapticFeedback?.notificationOccurred('warning');
        tg?.showAlert ? tg.showAlert('⚠️ Лимит Free-тарифа — 3 подписки.\nАктивируйте SpendMate PRO в чате бота, чтобы снять ограничения!') : alert('Лимит 3 подписки');
        return;
      }

      appState.subs.push({
        id: Date.now(),
        title: title,
        price: price,
        pay_day: day
      });

      titleInput.value = '';
      priceInput.value = '';
      dayInput.value = '';

      tg?.HapticFeedback?.notificationOccurred('success');
      renderDashboard();
      triggerAutoSave();
    }

    function removeSubLocally(id) {
      appState.subs = appState.subs.filter(s => s.id !== id);
      tg?.HapticFeedback?.impactOccurred('medium');
      renderDashboard();
      triggerAutoSave();
    }

    parsePayload();
  </script>
</body>
</html>
