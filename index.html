<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SpendMate Dashboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #090d16);
      color: var(--tg-theme-text-color, #f8fafc);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .card {
      background-color: var(--tg-theme-secondary-bg-color, #131c2e);
    }
  </style>
</head>
<body class="p-4 pb-20 select-none">
  <!-- Шапка -->
  <header class="flex justify-between items-center mb-5">
    <div>
      <span class="text-[11px] text-slate-400 font-semibold tracking-wider uppercase">Личный кабинет</span>
      <h1 class="text-xl font-bold flex items-center gap-1.5" id="user-greeting">
        SpendMate <span id="pro-badge" class="hidden text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full font-bold">PRO</span>
      </h1>
    </div>
    <div id="sub-counter-badge" class="card px-3 py-1 rounded-xl border border-slate-700/60 text-xs text-slate-300 font-medium">
      Подписок: 0/3
    </div>
  </header>

  <!-- Сводка расходов -->
  <section class="card p-5 rounded-2xl border border-slate-700/50 mb-6 shadow-xl shadow-indigo-950/30">
    <div class="text-xs text-slate-400 font-medium">Суммарный расход в месяц</div>
    <div class="text-3xl font-black text-indigo-400 mt-1" id="total-sum">0 ₽</div>
    <div class="mt-3 pt-3 border-t border-slate-700/40 flex justify-between items-center text-xs text-slate-400">
      <span>Напоминания: <b class="text-slate-200">за 24 ч</b></span>
      <span id="next-pay-hint">Ближайшая оплата: —</span>
    </div>
  </section>

  <!-- Список подписок -->
  <section class="mb-6">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Мои подписки</h2>
      <span id="limit-warning" class="hidden text-xs text-amber-400 font-medium">Лимит 3/3 (Free)</span>
    </div>

    <div id="subs-list" class="space-y-2.5"></div>

    <div id="empty-state" class="hidden py-8 text-center card rounded-2xl border border-dashed border-slate-700/60">
      <div class="text-2xl mb-1">📦</div>
      <div class="text-sm font-semibold text-slate-300">Подписок пока нет</div>
      <div class="text-xs text-slate-500 mt-1">Добавьте сервисы через форму ниже</div>
    </div>
  </section>

  <!-- Быстрый выбор -->
  <section class="mb-5">
    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2.5">Быстрый выбор</div>
    <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
      <button onclick="setPreset('Telegram Premium', 299)" class="card px-3 py-2 rounded-xl text-xs font-medium border border-slate-700/60 whitespace-nowrap active:scale-95 transition-all">⭐ TG Premium (299 ₽)</button>
      <button onclick="setPreset('Яндекс Плюс', 299)" class="card px-3 py-2 rounded-xl text-xs font-medium border border-slate-700/60 whitespace-nowrap active:scale-95 transition-all">🔴 Яндекс Плюс (299 ₽)</button>
      <button onclick="setPreset('VPN', 150)" class="card px-3 py-2 rounded-xl text-xs font-medium border border-slate-700/60 whitespace-nowrap active:scale-95 transition-all">🛡 VPN (150 ₽)</button>
      <button onclick="setPreset('VK Музыка', 169)" class="card px-3 py-2 rounded-xl text-xs font-medium border border-slate-700/60 whitespace-nowrap active:scale-95 transition-all">🎵 VK (169 ₽)</button>
    </div>
  </section>

  <!-- Форма добавления -->
  <section class="card p-5 rounded-2xl border border-slate-700/60 mb-6">
    <h3 class="text-sm font-bold mb-3 flex items-center gap-2">
      <span>➕</span> Добавить подписку в список
    </h3>
    <div class="space-y-3">
      <div>
        <label class="block text-[11px] text-slate-400 mb-1">Название</label>
        <input id="sub-title" type="text" placeholder="например: YouTube, iCloud" class="w-full px-3 py-2.5 rounded-xl bg-slate-900/70 border border-slate-700 text-sm focus:outline-none focus:border-indigo-500">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">Цена (₽)</label>
          <input id="sub-price" type="number" placeholder="299" class="w-full px-3 py-2.5 rounded-xl bg-slate-900/70 border border-slate-700 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">Число списания</label>
          <input id="sub-day" type="number" min="1" max="31" placeholder="от 1 до 31" class="w-full px-3 py-2.5 rounded-xl bg-slate-900/70 border border-slate-700 text-sm focus:outline-none focus:border-indigo-500">
        </div>
      </div>
      <button onclick="addSubLocally()" class="w-full mt-2 py-3 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-semibold rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/30">
        ➕ Добавить в список
      </button>
    </div>
  </section>

  <!-- Резервная кнопка сохранения (активна только вне клиента Telegram) -->
  <div id="sync-bar" class="hidden fixed bottom-0 left-0 right-0 p-4 bg-slate-950/90 backdrop-blur-md border-t border-slate-800 z-50">
    <button onclick="syncWithBot()" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 active:scale-98 text-slate-950 font-extrabold rounded-xl text-sm shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
      <span>💾 Сохранить изменения в бота</span>
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    let appState = { is_pro: false, subs: [] };

    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user?.first_name) {
        document.getElementById('user-greeting').innerHTML = `${tg.initDataUnsafe.user.first_name} <span id="pro-badge" class="hidden text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full font-bold">PRO</span>`;
      }
      tg.MainButton.setText("💾 СОХРАНИТЬ ИЗМЕНЕНИЯ");
      tg.MainButton.color = "#10b981";
      tg.MainButton.textColor = "#022c22";
      tg.MainButton.onClick(syncWithBot);
      tg.MainButton.hide();
    }

    function markDirty() {
      localStorage.setItem('spendmate_cache', JSON.stringify(appState));
      if (tg && tg.MainButton) {
        tg.MainButton.show();
      } else {
        document.getElementById('sync-bar')?.classList.remove('hidden');
      }
    }

    function parsePayload() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        let encoded = urlParams.get('d');

        if (encoded) {
          encoded = encoded.replace(/-/g, '+').replace(/_/g, '/');
          while (encoded.length % 4 !== 0) encoded += '=';
          const binary = atob(encoded);
          const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
          const decodedJson = new TextDecoder().decode(bytes);
          const parsed = JSON.parse(decodedJson);

          if (parsed && Array.isArray(parsed.subs)) {
            appState = parsed;
            localStorage.setItem('spendmate_cache', JSON.stringify(appState));
          }
        } else {
          const cached = localStorage.getItem('spendmate_cache');
          if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed && Array.isArray(parsed.subs)) appState = parsed;
          }
        }
      } catch (err) {
        console.error("Ошибка чтения:", err);
      }

      if (!appState || !Array.isArray(appState.subs)) {
        appState = { is_pro: false, subs: [] };
      }
      renderDashboard();
    }

    function getDaysUntil(payDay) {
      if (!payDay) return 0;
      const today = new Date();
      const currentDay = today.getDate();
      let diff = parseInt(payDay) - currentDay;
      if (diff < 0) {
        const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
        diff += daysInMonth;
      }
      return diff;
    }

    function getServiceIcon(title) {
      const t = String(title || '').toLowerCase();
      if (t.includes('tg') || t.includes('telegr') || t.includes('тг')) return '⭐';
      if (t.includes('янд') || t.includes('plus') || t.includes('плюс')) return '🔴';
      if (t.includes('vpn') || t.includes('впн')) return '🛡';
      if (t.includes('vk') || t.includes('вк')) return '🎵';
      if (t.includes('music') || t.includes('музык') || t.includes('spot')) return '🎧';
      if (t.includes('кино') || t.includes('film') || t.includes('иви') || t.includes('okko')) return '🎬';
      return '💳';
    }

    function renderDashboard() {
      const subsList = document.getElementById('subs-list');
      const emptyState = document.getElementById('empty-state');
      const totalSumEl = document.getElementById('total-sum');
      const counterEl = document.getElementById('sub-counter-badge');
      const proBadge = document.getElementById('pro-badge');
      const nextPayHint = document.getElementById('next-pay-hint');
      const limitWarning = document.getElementById('limit-warning');

      if (appState.is_pro) {
        proBadge?.classList.remove('hidden');
        counterEl.innerText = `Подписок: ${appState.subs.length} (PRO)`;
        limitWarning?.classList.add('hidden');
      } else {
        proBadge?.classList.add('hidden');
        counterEl.innerText = `Подписок: ${appState.subs.length}/3`;
        if (appState.subs.length >= 3) {
          limitWarning?.classList.remove('hidden');
        } else {
          limitWarning?.classList.add('hidden');
        }
      }

      let total = 0;
      let minDays = 999;
      let nextSubTitle = '';

      subsList.innerHTML = '';
      if (appState.subs.length === 0) {
        emptyState.classList.remove('hidden');
        nextPayHint.innerText = 'Ближайшая оплата: —';
      } else {
        emptyState.classList.add('hidden');
        appState.subs.forEach(sub => {
          const price = parseFloat(sub.price) || 0;
          total += price;
          const daysLeft = getDaysUntil(sub.pay_day);

          if (daysLeft < minDays) {
            minDays = daysLeft;
            nextSubTitle = sub.title;
          }

          let daysText = daysLeft === 0 ? 'Сегодня' : daysLeft === 1 ? 'Завтра' : `через ${daysLeft} дн.`;

          const card = document.createElement('div');
          card.className = "card p-3.5 rounded-xl border border-slate-700/40 flex items-center justify-between transition-all";
          card.innerHTML = `
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-slate-800/80 border border-slate-700 flex items-center justify-center text-lg">
                ${getServiceIcon(sub.title)}
              </div>
              <div>
                <div class="font-bold text-sm text-slate-200">${sub.title}</div>
                <div class="text-[11px] text-slate-400">Списание: ${sub.pay_day}-го числа (${daysText})</div>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <div class="font-extrabold text-sm text-indigo-300">${price} ₽</div>
              <button onclick="removeSubLocally(${sub.id})" class="p-2 text-slate-400 hover:text-rose-400 active:scale-90 transition-transform">
                🗑
              </button>
            </div>
          `;
          subsList.appendChild(card);
        });

        nextPayHint.innerText = minDays === 0 ? `Оплата сегодня: ${nextSubTitle}` : `Через ${minDays} дн. (${nextSubTitle})`;
      }

      totalSumEl.innerText = `${total} ₽`;
    }

    function setPreset(title, price) {
      document.getElementById('sub-title').value = title;
      document.getElementById('sub-price').value = price;
      document.getElementById('sub-day').value = new Date().getDate();
      tg?.HapticFeedback?.impactOccurred('light');
    }

    function addSubLocally() {
      const titleInput = document.getElementById('sub-title');
      const priceInput = document.getElementById('sub-price');
      const dayInput = document.getElementById('sub-day');

      const title = titleInput.value.trim();
      const price = parseFloat(priceInput.value);
      const day = parseInt(dayInput.value);

      if (!title || isNaN(price) || price <= 0 || isNaN(day) || day < 1 || day > 31) {
        tg?.HapticFeedback?.notificationOccurred('error');
        tg?.showAlert ? tg.showAlert('Заполните корректно название, цену и день (1–31)') : alert('Заполните все поля');
        return;
      }

      if (!appState.is_pro && appState.subs.length >= 3) {
        tg?.HapticFeedback?.notificationOccurred('warning');
        tg?.showAlert ? tg.showAlert('⚠️ Лимит Free-тарифа — 3 подписки.\nОформите SpendMate PRO в чате бота, чтобы снять ограничения!') : alert('Лимит 3 подписки');
        return;
      }

      appState.subs.push({
        id: Date.now(),
        title: title,
        price: price,
        pay_day: day
      });

      titleInput.value = '';
      priceInput.value = '';
      dayInput.value = '';

      tg?.HapticFeedback?.notificationOccurred('success');
      renderDashboard();
      markDirty();
    }

    function removeSubLocally(id) {
      appState.subs = appState.subs.filter(s => s.id !== id);
      tg?.HapticFeedback?.impactOccurred('medium');
      renderDashboard();
      markDirty();
    }

    function syncWithBot() {
      if (tg && tg.MainButton) {
        tg.MainButton.hide();
      }
      const payload = {
        action: 'sync_subs',
        subs: appState.subs
      };
      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert('Синхронизация: ' + JSON.stringify(payload));
      }
    }

    parsePayload();
  </script>
</body>
</html>
